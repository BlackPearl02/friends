# Friends — local PostgreSQL only.
# Start: pnpm db:up    Stop: pnpm db:down
# Host port 15433 → container 5432 (avoids PlayGrid on 15432).

services:
  postgres:
    image: postgres:16-alpine
    container_name: friends-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: friends
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - friends_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d friends"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 15s

volumes:
  friends_pgdata:
